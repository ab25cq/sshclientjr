apply plugin: "com.android.application"

android {
    namespace "com.sshclientjr"
    compileSdk 35

    def releaseStoreFile = findProperty("SSHCLIENTJR_RELEASE_STORE_FILE")
    def releaseStorePassword = findProperty("SSHCLIENTJR_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = findProperty("SSHCLIENTJR_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = findProperty("SSHCLIENTJR_RELEASE_KEY_PASSWORD")

    defaultConfig {
        applicationId "com.sshclientjr"
        minSdk 24
        targetSdk 35
        versionCode 56
        versionName "56"
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            excludes += ["**/libtermux.so"]
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "sshclientjr.apk"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.termux.termux-app:terminal-view:0.118.0"
    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
}
